# ==========================================================
# NGINX — CONTROLE DE GASTOS
#
# Proxy reverso da aplicação.
#
# Responsabilidades:
#
# /                   → login
# /pages/             → frontend
# /api/               → backend
# /admin/             → PgAdmin
#
# O frontend-web NÃO utiliza este arquivo.
# Este arquivo pertence somente ao nginx-proxy.
# ==========================================================


server {

    listen 80;

    server_name localhost;


    # ======================================================
    # HEADERS
    # ======================================================

    client_header_buffer_size 4k;

    large_client_header_buffers 4 16k;


    # ======================================================
    # ENTRADA PRINCIPAL
    #
    # Quando o usuário acessa:
    #
    # /
    #
    # ele é enviado para o login.
    # ======================================================

    location = / {

        return 302 /pages/login/login.html;

    }


    # ======================================================
    # API — BACKEND NODE.JS
    # ======================================================

    location /api/ {

        proxy_pass http://backend:3000;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_set_header Connection "";

    }


    # ======================================================
    # PGADMIN
    #
    # /admin
    #     ↓
    # /admin/
    # ======================================================

    location = /admin {

        return 301 /admin/;

    }


    # ======================================================
    # PGADMIN
    # ======================================================

    location /admin/ {

        proxy_pass http://pgadmin:80/;

        proxy_redirect off;


        proxy_set_header X-Script-Name /admin;

        proxy_set_header X-Scheme $scheme;

        proxy_set_header X-Forwarded-Prefix /admin;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # Mantém os cookies do PgAdmin isolados
        # dentro de /admin/.

        proxy_cookie_path / /admin/;

    }


    # ======================================================
    # FRONTEND
    #
    # Todas as páginas estáticas são servidas pelo
    # frontend-web.
    # ======================================================

    location / {

        proxy_pass http://web:80;

        proxy_http_version 1.1;


        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_set_header Connection "";

    }

}