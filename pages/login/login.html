<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle de Gastos</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Design System -->

    <link rel="stylesheet"
          href="../../assets/css/variables.css">

    <link rel="stylesheet"
          href="../../assets/css/reset.css">

    <link rel="stylesheet"
          href="../../assets/css/global.css">

    <link rel="stylesheet"
          href="../../assets/css/components.css">

    <link rel="stylesheet"
          href="../../assets/css/animations.css">

    <!-- Página -->

    <link rel="stylesheet"
          href="./login.css">

</head>

<body>

    <main class="login-page">

        <!-- Background decorativo -->

        <div class="background-blur background-left"></div>

        <div class="background-blur background-right"></div>

        <!-- Card -->

        <section class="login-card card slide-up">

            <!-- Logo -->

            <div class="logo-container">

                <div class="logo">

                    CG

                </div>

            </div>

            <h1 class="login-title">

                Controle de Gastos

            </h1>

            <p class="login-subtitle">

                Organize sua vida financeira de forma simples.

            </p>

            <!-- Formulário -->

            <form
                id="login-form"
                class="login-form">

                <div class="input-group">

                    <label
                        class="label"
                        for="email">

                        Email

                    </label>

                    <input

                        id="email"

                        class="input"

                        type="email"

                        placeholder="Digite seu email"

                        autocomplete="email"

                        required>

                </div>

                <div class="input-group">

                    <label
                        class="label"
                        for="password">

                        Senha

                    </label>

                    <input

                        id="password"

                        class="input"

                        type="password"

                        placeholder="Digite sua senha"

                        autocomplete="current-password"

                        required>

                </div>

                <!-- Mensagem de erro -->

                <div
                    id="login-error"
                    class="alert alert-error hidden">

                </div>

                <!-- Botão -->

                <button

                    id="login-button"

                    type="submit"

                    class="btn btn-primary hover-lift">

                    Entrar

                </button>

            </form>

            <div class="login-divider">

                <span></span>

                <p>ou</p>

                <span></span>

            </div>

            <a

                class="btn btn-outline"

                href="../register/register.html">

                Criar conta

            </a>

            <footer class="login-footer">

                <p>

                    Desenvolvido por Ary Elderyck

                </p>

            </footer>

        </section>

    </main>

    <script src="./login.js"></script>

</body>

</html>
