<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Entre na sua conta do Controle de Gastos."
    >

    <meta
        name="theme-color"
        content="#0F172A"
    >

    <title>
        Entrar | Controle de Gastos
    </title>


    <!-- ==================================================
         FONTES
    =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         DESIGN SYSTEM
    =================================================== -->

    <link
        rel="stylesheet"
        href="../../assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="../../assets/css/animations.css"
    >


    <!-- ==================================================
         ESTILOS DA PÁGINA
    =================================================== -->

    <link
        rel="stylesheet"
        href="./login.css"
    >

</head>


<body>

    <main class="login-page">


        <!-- ==================================================
             DECORAÇÃO DO BACKGROUND
        =================================================== -->

        <div
            class="background-blur background-left"
            aria-hidden="true"
        ></div>

        <div
            class="background-blur background-right"
            aria-hidden="true"
        ></div>


        <!-- ==================================================
             CARD DE LOGIN
        =================================================== -->

        <section
            class="login-card card"
            aria-labelledby="login-title"
        >


            <!-- ==================================================
                 LOGO
            =================================================== -->

            <div class="logo-container">

                <div
                    class="logo"
                    aria-hidden="true"
                >
                    CG
                </div>

            </div>


            <!-- ==================================================
                 CABEÇALHO
            =================================================== -->

            <header class="login-header">

                <p class="login-eyebrow">
                    CONTROLE DE GASTOS
                </p>

                <h1
                    id="login-title"
                    class="login-title"
                >
                    Bem-vindo de volta
                </h1>

                <p class="login-subtitle">
                    Entre na sua conta para continuar
                    acompanhando sua vida financeira.
                </p>

            </header>


            <!-- ==================================================
                 FORMULÁRIO
            =================================================== -->

            <form
                id="login-form"
                class="login-form"
                novalidate
            >


                <!-- ==================================================
                     EMAIL
                =================================================== -->

                <div
                    id="email-group"
                    class="input-group"
                >

                    <label
                        class="label"
                        for="email"
                    >
                        Email
                    </label>


                    <input
                        id="email"
                        class="input"
                        type="email"
                        name="email"
                        placeholder="Digite seu email"
                        autocomplete="email"
                        inputmode="email"
                        aria-describedby="email-required-error email-invalid-error"
                        aria-invalid="false"
                        required
                    >


                    <p
                        id="email-required-error"
                        class="field-error"
                        hidden
                    >
                        Informe seu email.
                    </p>


                    <p
                        id="email-invalid-error"
                        class="field-error"
                        hidden
                    >
                        Digite um email válido.
                    </p>

                </div>


                <!-- ==================================================
                     SENHA
                =================================================== -->

                <div
                    id="password-group"
                    class="input-group"
                >

                    <div class="password-label-row">

                        <label
                            class="label"
                            for="password"
                        >
                            Senha
                        </label>


                        <button
                            id="recover-password-button"
                            class="text-button"
                            type="button"
                            disabled
                        >
                            Esqueci minha senha
                        </button>

                    </div>


                    <div class="password-input-wrap">

                        <input
                            id="password"
                            class="input"
                            type="password"
                            name="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            aria-describedby="password-required-error password-invalid-error"
                            aria-invalid="false"
                            required
                        >


                        <button
                            id="toggle-password-button"
                            class="password-toggle"
                            type="button"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>

                    </div>


                    <p
                        id="password-required-error"
                        class="field-error"
                        hidden
                    >
                        Informe sua senha.
                    </p>


                    <p
                        id="password-invalid-error"
                        class="field-error"
                        hidden
                    >
                        A senha deve possuir pelo menos
                        6 caracteres.
                    </p>

                </div>


                <!-- ==================================================
                     MENSAGEM DO LOGIN
                =================================================== -->

                <div
                    id="login-message"
                    class="feedback"
                    role="status"
                    aria-live="polite"
                    hidden
                ></div>


                <!-- ==================================================
                     BOTÃO ENTRAR
                =================================================== -->

                <button
                    id="login-button"
                    class="button button-primary button-block"
                    type="submit"
                    disabled
                >
                    Entrar
                </button>

            </form>


            <!-- ==================================================
                 DIVISOR
            =================================================== -->

            <div
                class="login-divider"
                aria-hidden="true"
            >

                <span></span>

                <p>ou</p>

                <span></span>

            </div>


            <!-- ==================================================
                 CADASTRO
            =================================================== -->

            <button
                id="register-button"
                class="button button-outline button-block"
                type="button"
            >
                Criar uma conta
            </button>


            <!-- ==================================================
                 RODAPÉ
            =================================================== -->

            <footer class="login-footer">

                <p>
                    Desenvolvido por Ary Elderyck
                </p>

            </footer>

        </section>

    </main>


    <!-- ==================================================
         JAVASCRIPT DA PÁGINA
    =================================================== -->

    <script
        src="./login.js"
        defer
    ></script>

</body>

</html>
