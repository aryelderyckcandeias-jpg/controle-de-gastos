
services:

  # ============================================================
  # FRONTEND
  # ============================================================

  web:
    container_name: frontend-web

    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "80"

    labels:
      - "com.example.project=controle-gastos"
      - "com.example.tier=frontend"

    networks:
      - backend

    restart: unless-stopped


  # ============================================================
  # BACKEND NODE.JS
  # ============================================================

  backend:
    container_name: controle-gastos-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      PORT: 3000
      NODE_ENV: development

      REDIS_URL: redis://redis:6379

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      SESSION_SECRET: ${SESSION_SECRET}

      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}

    expose:
      - "3000"

    depends_on:
      - postgres
      - redis

    labels:
      - "com.example.project=controle-gastos"
      - "com.example.tier=backend"

    networks:
      - backend

    restart: unless-stopped


  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    container_name: database-postgres

    image: postgres:13

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      # Banco dedicado do JasperReports Server (criado no 1º boot).
      JASPER_DB_USER: ${JASPER_DB_USER:-jasper}
      JASPER_DB_PASSWORD: ${JASPER_DB_PASSWORD:-jasperpass}
      JASPER_DB_NAME: ${JASPER_DB_NAME:-jasperserver}

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-jasper.sh:/docker-entrypoint-initdb.d/init-jasper.sh
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - backend

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    container_name: redis-cache

    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    volumes:
      - redis_data:/data

    networks:
      - backend

    restart: unless-stopped


  # ============================================================
  # PGADMIN
  # ============================================================

  pgadmin:
    container_name: pgadmin-interface

    image: dpage/pgadmin4

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    depends_on:
      - postgres

    networks:
      - backend

    restart: unless-stopped


  # ============================================================
  # JASPERREPORTS SERVER (RELATÓRIOS)
  #
  # Servidor de relatórios (Java/Tomcat) - Community Edition.
  # Usa uma imagem de comunidade mantida por terceiros no
  # Docker Hub, já que a imagem oficial da Jaspersoft não é
  # mais publicada lá (é preciso buildar manualmente).
  #
  # O repositório dos relatórios é o banco 'jasperserver',
  # criado no primeiro boot pelo script ./init-jasper.sh
  # dentro do Postgres da aplicação.
  # ============================================================

  jasperserver:
    container_name: jasperserver-reports

    image: judahpaul/jasperserver:latest

    environment:
      # Tipo e conexão com o banco de repositório.
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${JASPER_DB_NAME:-jasperserver}
      DB_USER: ${JASPER_DB_USER:-jasper}
      DB_PASSWORD: ${JASPER_DB_PASSWORD:-jasperpass}

    ports:
      # Interface web do JasperReports Server.
      # Acesse em http://localhost:8080/jasperserver
      - "8080:8080"

    depends_on:
      - postgres

    labels:
      - "com.example.project=controle-gastos"
      - "com.example.tier=reporting"

    networks:
      - backend

    # JasperReports Server é uma aplicação Java/Tomcat pesada.
    # Reserve memória para que o JVM escale o heap corretamente.
    mem_limit: "3g"
    mem_reservation: "1g"

    restart: unless-stopped


  # ============================================================
  # NGINX
  # ============================================================

  nginx:
    container_name: nginx-proxy

    image: nginx:alpine

    ports:
      - "8081:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web
      - backend
      - pgadmin

    networks:
      - backend

    restart: unless-stopped


# ==============================================================
# VOLUMES
# ==============================================================

volumes:
  postgres_data:
  redis_data:


# ==============================================================
# NETWORK
# ==============================================================

networks:
  backend:
    driver: bridge