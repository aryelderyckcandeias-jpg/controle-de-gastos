
services:
 # Aplicação HTML/CSS/JavaScript
  web:
    container_name: frontend-web
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    labels:
      - "com.example.project=controle-gastos"
      - "com.example.tier=frontend"
    networks:
      - backend
    restart: unless-stopped

  # Backend Node.js
  backend:
    container_name: controle-gastos-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy  
    labels:
      - "com.example.project=controle-gastos"
      - "com.example.tier=backend"
    networks:
      - backend
    restart: unless-stopped

 # Banco de dados PostgreSQL
  postgres:
    container_name: database-postgres
    image: postgres:13
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
        # Seu script SQL
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistência dos dados
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

   # Redis
  redis:
    container_name: redis-cache
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped 

# Interface visual para administrar o PostgreSQL
  pgadmin:
    container_name: pgadmin-interface
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

# Nginx público
  nginx:
    container_name: nginx-proxy
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - backend
      - pgadmin
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge




